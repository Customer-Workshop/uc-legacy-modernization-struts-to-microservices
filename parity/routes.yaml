modules:
  policy: extracted
  intake: extracted
  settlement: extracted
  workbench: pending
  reporting: pending
routes:
  "/claims/login.do":
    module: policy
    service: policy
    method: POST
    url: /api/auth/login
    body: {username: username, password: password}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: signedInUser, from: /signedInUser, normalize: text}
  "/claims/policy/search.do":
    module: policy
    service: policy
    method: GET
    url: /api/policies
    query: {lineOfBusiness: lineOfBusiness}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - foreach:
          from: /
          item_key: policyId
          field: policyLimit_{policyId}
          value_from: /policyLimit
          normalize: money
  "/claims/policy/view.do":
    module: policy
    service: policy
    method: GET
    url: /api/policies/{policyId}
    query: {policyId: policyId}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: policyLimit, from: /policyLimit, normalize: money}
      - {field: deductibleApplied, from: /deductible, normalize: money}
      - {field: policyStatus, from: /status, normalize: text}
  "/claims/intake/submit.do":
    module: intake
    service: intake
    method: POST
    url: /api/claims
    body: {claimantName: claimantName, description: description, lossDate: lossDate, lossType: lossType}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: claimId, from: /claimId, normalize: integer}
      - {field: claimStatus, from: /claimStatus, normalize: text}
  "/claims/settlement/calculate.do":
    module: settlement
    service: settlement
    method: POST
    url: /api/settlements/calculate
    body: {claimId: claimId, coveredAmount: coveredAmount, deductible: deductible, depreciation: depreciation}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: coveredAmount, from: /coveredAmount, normalize: money}
      - {field: deductibleApplied, from: /deductibleApplied, normalize: money}
      - {field: depreciation, from: /depreciation, normalize: money}
      - {field: cappedAtLimit, from: /cappedAtLimit, normalize: text}
      - {field: settlementAmount, from: /settlementAmount, normalize: money}
  "/claims/settlement/save.do":
    module: settlement
    service: settlement
    method: POST
    url: /api/settlements
    body: {claimId: claimId, coveredAmount: coveredAmount, deductible: deductible, depreciation: depreciation}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: savedBy, from: /savedBy, normalize: text}
      - {field: settlementAmount, from: /settlementAmount, normalize: money}
  "/claims/payment/issue.do":
    module: settlement
    service: settlement
    method: POST
    url: /api/payments
    body: {claimId: claimId, payeeName: payeeName, amount: amount, paymentMethod: paymentMethod}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: checkNumber, from: /checkNumber, normalize: text}
      - {field: paymentAmount, from: /paymentAmount, normalize: money}
      - {field: paymentStatus, from: /paymentStatus, normalize: text}
  "/claims/payment/history.do":
    module: settlement
    service: settlement
    method: GET
    url: /api/payments
    query: {claimId: claimId}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - foreach:
          from: /payments
          item_key: paymentId
          field: checkNumber_{paymentId}
          value_from: /checkNumber
          normalize: text
      - foreach:
          from: /payments
          item_key: paymentId
          field: paymentAmount_{paymentId}
          value_from: /amount
          normalize: money
      - foreach:
          from: /payments
          item_key: paymentId
          field: paymentStatus_{paymentId}
          value_from: /status
          normalize: text
probes:
  policy:
    service: policy
    url: /api/policies/{id}
    fields:
      limit: {from: /policyLimit, normalize: money}
      status: {from: /status, normalize: text}
  claim:
    service: intake
    url: /api/claims/{id}
    fields:
      loss_date: {from: /lossDate, normalize: text}
      status: {from: /status, normalize: text}
      exists: {exists: true}
  settlement:
    service: settlement
    url: /api/settlements/latest-by-claim
    fields:
      119.amount: {from: /119/amount, normalize: money}
      120.amount: {from: /120/amount, normalize: money}
  payment:
    service: settlement
    url: /api/payments/{id}
    fields:
      amount: {from: /amount, normalize: money}
      status: {from: /status, normalize: text}
      claim.119: {from: /claim/119, normalize: integer}
      claim.120: {from: /claim/120, normalize: integer}
