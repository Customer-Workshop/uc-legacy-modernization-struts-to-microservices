modules:
  policy: extracted
  intake: extracted
  settlement: pending
  workbench: pending
  reporting: extracted
routes:
  "/claims/login.do":
    module: policy
    service: policy
    method: POST
    url: /api/auth/login
    body: {username: username, password: password}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: signedInUser, from: /signedInUser, normalize: text}
  "/claims/policy/search.do":
    module: policy
    service: policy
    method: GET
    url: /api/policies
    query: {lineOfBusiness: lineOfBusiness}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - foreach:
          from: /
          item_key: policyId
          field: policyLimit_{policyId}
          value_from: /policyLimit
          normalize: money
  "/claims/policy/view.do":
    module: policy
    service: policy
    method: GET
    url: /api/policies/{policyId}
    query: {policyId: policyId}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: policyLimit, from: /policyLimit, normalize: money}
      - {field: deductibleApplied, from: /deductible, normalize: money}
      - {field: policyStatus, from: /status, normalize: text}
  "/claims/intake/submit.do":
    module: intake
    service: intake
    method: POST
    url: /api/claims
    body: {claimantName: claimantName, description: description, lossDate: lossDate, lossType: lossType}
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - {field: claimId, from: /claimId, normalize: integer}
      - {field: claimStatus, from: /claimStatus, normalize: text}
  "/claims/report/openByAdjuster.do":
    module: reporting
    service: reporting
    method: GET
    url: /api/reports/open-by-adjuster
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - foreach:
          from: /
          item_key: adjuster
          field: openCount_{adjuster}
          value_from: /openCount
          normalize: integer
      - foreach:
          from: /
          item_key: adjuster
          field: reserveTotal_{adjuster}
          value_from: /reserveTotal
          normalize: money
  "/claims/report/lossRatio.do":
    module: reporting
    service: reporting
    method: GET
    url: /api/reports/loss-ratio
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - foreach:
          from: /
          item_key: lineOfBusiness
          field: premiumTotal_{lineOfBusiness}
          value_from: /premiumTotal
          normalize: money
      - foreach:
          from: /
          item_key: lineOfBusiness
          field: lossTotal_{lineOfBusiness}
          value_from: /lossTotal
          normalize: money
      - foreach:
          from: /
          item_key: lineOfBusiness
          field: lossRatio_{lineOfBusiness}
          value_from: /lossRatio
          normalize: money
  "/claims/report/agedClaims.do":
    module: reporting
    service: reporting
    method: GET
    url: /api/reports/aged-claims
    status: {forward: 2, validation: 4, redirect: 3, error: 5}
    validation_errors: /validationErrors
    business_fields:
      - foreach:
          from: /
          item_key: bucket
          field: agedBucket_{bucket}
          value_from: /claimCount
          normalize: integer
      - foreach:
          from: /
          item_key: bucket
          field: agedReserve_{bucket}
          value_from: /reserveTotal
          normalize: integer
probes:
  policy:
    service: policy
    url: /api/policies/{id}
    fields:
      limit: {from: /policyLimit, normalize: money}
      status: {from: /status, normalize: text}
  claim:
    service: intake
    url: /api/claims/{id}
    fields:
      loss_date: {from: /lossDate, normalize: text}
      status: {from: /status, normalize: text}
      exists: {exists: true}
