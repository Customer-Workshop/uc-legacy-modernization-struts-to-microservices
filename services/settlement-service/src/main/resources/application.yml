server.port: ${PORT:8083}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:settlement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway:
    enabled: true
management.endpoints.web.exposure.include: health,info
settlement:
  policy-base-url: ${POLICY_BASE_URL:http://localhost:8081}
  intake-base-url: ${INTAKE_BASE_URL:http://localhost:8082}
  http:
    connect-timeout: ${SETTLEMENT_HTTP_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${SETTLEMENT_HTTP_READ_TIMEOUT:PT5S}
