services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: claims_${NS:-dev}
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["claims-data:/var/lib/postgresql/data"]
  policy-service:
    build:
      context: ./services/policy-service
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo.maven.apache.org/maven2}
    environment:
      PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claims_${NS:-dev}?currentSchema=policy
      SPRING_DATASOURCE_USERNAME: claims
      SPRING_DATASOURCE_PASSWORD: claims
      SPRING_FLYWAY_DEFAULT_SCHEMA: policy
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
    ports: ["${POLICY_PORT:-8081}:8081"]
    depends_on: [postgres]
  claims-intake-service:
    build:
      context: ./services/claims-intake-service
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo.maven.apache.org/maven2}
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claims_${NS:-dev}?currentSchema=intake
      SPRING_DATASOURCE_USERNAME: claims
      SPRING_DATASOURCE_PASSWORD: claims
      SPRING_FLYWAY_DEFAULT_SCHEMA: intake
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
    ports: ["${INTAKE_PORT:-8082}:8082"]
    depends_on: [postgres]
  workbench-service:
    build:
      context: ./services/workbench-service
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://repo.maven.apache.org/maven2}
    environment:
      PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claims_${NS:-dev}?currentSchema=workbench
      SPRING_DATASOURCE_USERNAME: claims
      SPRING_DATASOURCE_PASSWORD: claims
      SPRING_FLYWAY_DEFAULT_SCHEMA: workbench
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
    ports: ["${WORKBENCH_PORT:-8084}:8084"]
    depends_on: [postgres]
volumes:
  claims-data:
